<!DOCTYPE html>

<body>
    <h1>Utilizando carga de Imagens</h1>
    <hr>
    <p>Abaixo colocarei uma imagem que está na mesma pasta que o Index:</p>
    <img src="logo-html200.webp" alt="Logo HTML5">
    <p>Também é possível adicionar imagens localizadas em sub-pastas:</p>
    <img src="imagens/logo-css-200.webp" alt="Logo CSS3">
    <p>Também é possível colocar uma imagem externa, algo que eu utilizei no meu projeto de TCC.</p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3hY9Hm-jpapPeDuzSU52R7nC-RcOJ_NxLo-GbPRgK8ZVV93SoITQPfASs&s=10" alt="Emoji constrangido">
